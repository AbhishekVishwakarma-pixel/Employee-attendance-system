<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance History – Attendance Pro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments :: sidebar('history')}"></div>
    <main class="main-content">
        <header class="page-header flex-between">
            <div>
                <h1><i class="fas fa-history"></i> Attendance History</h1>
                <p class="page-subtitle">Filter and export records</p>
            </div>
            <a th:href="@{/attendance/export(date=${selectedDate}, employeeId=${selectedEmployeeId}, department=${selectedDepartment})}"
               class="btn btn-primary"><i class="fas fa-download"></i> Export CSV</a>
        </header>
        <div th:replace="~{fragments :: alerts}"></div>

        <div class="content-card search-card">
            <form th:action="@{/attendance/history}" method="get" class="search-form">
                <div class="filter-row">
                    <div class="filter-item">
                        <label>Date</label>
                        <input type="date" name="date" th:value="${selectedDate}" class="search-input">
                    </div>
                    <div class="filter-item">
                        <label>Employee</label>
                        <select name="employeeId" class="search-input">
                            <option value="">All</option>
                            <option th:each="emp : ${allEmployees}" th:value="${emp.employeeId}"
                                    th:text="${emp.employeeId + ' - ' + emp.fullName}"
                                    th:selected="${emp.employeeId == selectedEmployeeId}"></option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label>Department</label>
                        <select name="department" class="search-input">
                            <option value="">All</option>
                            <option th:each="d : ${departments}" th:value="${d}" th:text="${d}"
                                    th:selected="${d == selectedDepartment}"></option>
                        </select>
                    </div>
                    <div class="filter-item filter-btn">
                        <label>&nbsp;</label>
                        <button type="submit" class="btn btn-primary">Filter</button>
                        <a th:href="@{/attendance/history}" class="btn btn-secondary">Clear</a>
                    </div>
                </div>
            </form>
        </div>

        <div th:if="${selectedDate != null}" class="stat-cards compact-stats">
            <div class="stat-card card-blue"><div class="stat-info"><span class="stat-label">Total</span><span class="stat-value" th:text="${totalEmployees}">0</span></div></div>
            <div class="stat-card card-green"><div class="stat-info"><span class="stat-label">Present</span><span class="stat-value" th:text="${presentCount}">0</span></div></div>
            <div class="stat-card card-red"><div class="stat-info"><span class="stat-label">Absent</span><span class="stat-value" th:text="${absentCount}">0</span></div></div>
            <div class="stat-card card-purple"><div class="stat-info"><span class="stat-label">%</span><span class="stat-value"><span th:text="${percentage}">0</span>%</span></div></div>
        </div>

        <div class="content-card">
            <div th:if="${#lists.isEmpty(records)}" class="empty-state">
                <i class="fas fa-inbox fa-2x"></i>
                <h3>No records found</h3>
            </div>
            <div th:unless="${#lists.isEmpty(records)}" class="table-wrapper">
                <table class="data-table">
                    <thead>
                    <tr><th>#</th><th>ID</th><th>Name</th><th>Dept</th><th>Date</th><th>Status</th><th>Remark</th><th></th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="rec, stat : ${records}">
                        <td th:text="${stat.count}"></td>
                        <td th:text="${rec.employeeId}"></td>
                        <td th:text="${rec.employeeName}"></td>
                        <td th:text="${rec.department}"></td>
                        <td th:text="${rec.date}"></td>
                        <td>
                            <span th:class="${rec.status == 'Present'} ? 'badge badge-present' : 'badge badge-absent'"
                                  th:text="${rec.status}"></span>
                        </td>
                        <td th:text="${rec.remark != null ? rec.remark : '—'}"></td>
                        <td>
                            <a th:href="@{/attendance/employee/{id}(id=${rec.employeeId})}" class="btn-icon btn-view"><i class="fas fa-chart-bar"></i></a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
