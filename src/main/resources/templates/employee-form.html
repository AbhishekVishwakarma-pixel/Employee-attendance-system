<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Employee Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments :: sidebar('employees')}"></div>
    <main class="main-content">
        <header class="page-header flex-between">
            <div>
                <h1>
                    <i th:class="${isEdit} ? 'fas fa-user-edit' : 'fas fa-user-plus'"></i>
                    <span th:text="${pageTitle}">Add Employee</span>
                </h1>
            </div>
            <a th:href="@{/employees}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
        </header>

        <div class="content-card form-card">
            <form th:action="@{/employees/save}" th:object="${employee}" method="post" class="app-form">
                <div class="form-group">
                    <label>Employee ID <span class="required">*</span></label>
                    <input type="text" th:field="*{employeeId}" placeholder="e.g. EMP008"
                           th:readonly="${isEdit}"
                           th:classappend="${#fields.hasErrors('employeeId')} ? 'input-error' : ''" required>
                    <div class="error-msg" th:if="${#fields.hasErrors('employeeId')}" th:errors="*{employeeId}"></div>
                    <small th:if="${isEdit}" class="hint">ID cannot be changed</small>
                </div>
                <div class="form-group">
                    <label>Full Name <span class="required">*</span></label>
                    <input type="text" th:field="*{fullName}" placeholder="Enter full name"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'input-error' : ''" required>
                    <div class="error-msg" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>
                <div class="form-group">
                    <label>Designation</label>
                    <input type="text" th:field="*{designation}" placeholder="e.g. Software Engineer">
                </div>
                <div class="form-group">
                    <label>Department <span class="required">*</span></label>
                    <select th:field="*{department}" required>
                        <option value="">-- Select --</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Operations">Operations</option>
                        <option value="Sales">Sales</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Phone <span class="required">*</span></label>
                    <input type="tel" th:field="*{phone}" placeholder="Phone number"
                           th:classappend="${#fields.hasErrors('phone')} ? 'input-error' : ''" required>
                    <div class="error-msg" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" placeholder="email@company.com">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i>
                        <span th:text="${isEdit} ? 'Update' : 'Save'">Save</span>
                    </button>
                    <a th:href="@{/employees}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
